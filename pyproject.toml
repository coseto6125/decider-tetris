[project]
name = "decider-tetris"
version = "0.1.0"
description = "Tetris played by a small decision model: Python enumerates the landings, the model judges them."
readme = "README.md"
requires-python = ">=3.13,<3.14"  # tetris-gymnasium pulls jaxlib, which has no 3.14 wheel
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "tetris-gymnasium>=0.3.1",
    "websockets>=15",
]

[project.scripts]
decider-tetris = "decider_tetris.play:main"
decider-tetris-race = "decider_tetris.race:main"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
